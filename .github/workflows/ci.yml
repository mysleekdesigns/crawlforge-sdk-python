name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # The models, the tool methods and the README table are generated from
      # openapi.json and committed; a stale file fails here.
      - name: Regenerate and check for drift
        run: |
          python scripts/generate.py
          git diff --exit-code -- crawlforge/_generated openapi.json README.md
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy crawlforge scripts
      - name: Test
        run: pytest
      - name: Build sdist and wheel
        run: python -m build
