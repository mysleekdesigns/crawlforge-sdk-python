name: Release

# Publishes to PyPI on a tag such as v0.1.0 with trusted publishing: the
# `pypi` environment must be registered on pypi.org as a trusted publisher of
# this repository and workflow. No token lives in the repository.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version in pyproject.toml
        run: |
          python - <<'EOF_CHECK'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          print(f"releasing {version}")
          EOF_CHECK
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regenerate and check for drift
        run: |
          python scripts/generate.py
          git diff --exit-code -- crawlforge/_generated openapi.json README.md
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
