[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crawlforge"
version = "0.1.0"
description = "Official Python SDK for the CrawlForge REST API: 30 metered web tools behind one API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "CrawlForge" }]
keywords = ["crawlforge", "web scraping", "crawler", "search", "extraction", "mcp", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.8",
  "build>=1.0",
]

[project.urls]
Homepage = "https://www.crawlforge.dev"
Documentation = "https://www.crawlforge.dev/docs/api-reference"
Source = "https://github.com/mysleekdesigns/crawlforge-sdk-python"
Changelog = "https://github.com/mysleekdesigns/crawlforge-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["crawlforge"]

[tool.hatch.build.targets.sdist]
exclude = [".venv*", ".github", "dist", ".pytest_cache", ".mypy_cache", ".ruff_cache", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv*", "dist"]

[tool.ruff.format]
exclude = ["crawlforge/_generated/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"crawlforge/_generated/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["crawlforge"]

[tool.mypy]
strict = true
warn_unreachable = true
